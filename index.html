<!DOCTYPE html>
<html lang="en" data-path-style="sub">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>base64</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      color: #222;
      background: #fff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      flex: 0 0 auto;
      padding: 8px 12px 6px;
      border-bottom: 1px solid #e8e8e8;
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      background: #fafafa;
    }
    header a.home {
      color: #333;
      text-decoration: none;
      font-weight: bold;
    }
    header a.home:hover { text-decoration: underline; }
    .path {
      color: #666;
      font-size: 14px;
      user-select: all;
    }
    .path input {
      font: inherit;
      color: #333;
      border: none;
      background: transparent;
      border-bottom: 1px dashed #ccc;
      min-width: 8ch;
      max-width: 40vw;
      padding: 0 2px;
    }
    .path input:focus {
      outline: none;
      border-bottom-color: #888;
    }
    .meta {
      margin-left: auto;
      font-size: 12px;
      color: #888;
    }
    .meta.err { color: #b33; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    label.pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-bottom: 1px solid #eee;
    }
    label.pane:first-of-type { flex: 1.35; }
    label.pane:last-of-type { flex: 1; border-bottom: none; }
    .pane-title {
      flex: 0 0 auto;
      padding: 4px 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #999;
      background: #fcfcfc;
    }
    textarea {
      flex: 1;
      width: 100%;
      border: none;
      resize: none;
      padding: 12px 14px;
      font: inherit;
      line-height: 1.45;
      color: #222;
      background: #fff;
    }
    textarea:focus { outline: none; }
    textarea::placeholder { color: #aaa; }
    textarea.out {
      font-family: ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, monospace;
      font-size: 14px;
      background: #fafafa;
      color: #111;
    }
  </style>
</head>
<body>
  <header>
    <a class="home" href="#" id="brand">base64</a>
    <span class="path">/<input type="text" id="pad" spellcheck="false" autocomplete="off" placeholder="yourpage" /></span>
    <span class="meta" id="status"></span>
  </header>
  <main>
    <label class="pane">
      <span class="pane-title">Base64 in</span>
    </label>
    <label class="pane">
      <span class="pane-title">Decoded</span>
      <textarea id="out" class="out" readonly spellcheck="false" placeholder="UTF-8 text appears here."></textarea>
    </label>
  </main>
  <script>
    (function () {
      var pad = document.getElementById("pad");
      var input = document.getElementById("in");
      var output = document.getElementById("out");
      var status = document.getElementById("status");
      var brand = document.getElementById("brand");

      function padKey() {
        var slug = (pad.value || "home").trim().replace(/^\/+/, "") || "home";
        return "b64dontpad:" + slug;
      }

      function loadFromStorage() {
        try {
          var raw = localStorage.getItem(padKey());
          if (raw != null) input.value = raw;
        } catch (e) {}
      }

      var saveTimer;
      function scheduleSave() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(function () {
          try {
            localStorage.setItem(padKey(), input.value);
          } catch (e) {}
        }, 250);
      }

      function decodeB64(s) {
        var t = s.replace(/\s/g, "");
        if (!t.length) return { ok: true, text: "" };
        var padLen = t.length % 4;
        if (padLen) t += "====".slice(padLen);
        var bin = atob(t);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return { ok: true, text: new TextDecoder("utf-8", { fatal: false }).decode(bytes) };
      }

      function refreshDecode() {
        try {
          var r = decodeB64(input.value);
          output.value = r.text;
          status.textContent = input.value.replace(/\s/g, "").length
            ? "decoded · " + r.text.length + " chars"
            : "";
          status.classList.remove("err");
        } catch (e) {
          output.value = "";
          status.textContent = "not valid Base64";
          status.classList.add("err");
        }
      }

      /**
       * Path URLs (no #hash). data-path-style on <html>:
       *  "sub" (default): /repo/ home, /repo/mypad pad — GitHub Pages project sites.
       *  "domain": / home, /mypad pad — own domain or Pages user site at root.
       */
      function pathStyle() {
        var v = (document.documentElement.getAttribute("data-path-style") || "sub").toLowerCase();
        return v === "domain" ? "domain" : "sub";
      }

      function decodeSeg(s) {
        try {
          return decodeURIComponent(s);
        } catch (e) {
          return s;
        }
      }

      function splitPath() {
        var path = location.pathname.replace(/\/index\.html$/i, "").replace(/\/+/g, "/");
        if (path !== "/" && path.endsWith("/")) path = path.slice(0, -1);
        var segs = path.split("/").filter(Boolean);
        if (pathStyle() === "domain") {
          if (segs.length === 0) return { basePath: "/", slug: "" };
          if (segs.length === 1) return { basePath: "/", slug: decodeSeg(segs[0]) };
          var slugD = decodeSeg(segs.pop());
          return { basePath: "/" + segs.join("/") + "/", slug: slugD };
        }
        if (segs.length === 0) return { basePath: "/", slug: "" };
        if (segs.length === 1) return { basePath: "/" + segs[0] + "/", slug: "" };
        var slugS = decodeSeg(segs.pop());
        return { basePath: "/" + segs.join("/") + "/", slug: slugS };
      }

      function currentUrl() {
        var slug = (pad.value || "").trim().replace(/^\/+/, "");
        var sp = splitPath();
        var path = sp.basePath;
        if (path.length > 1 && !path.endsWith("/")) path += "/";
        if (slug.length) path += encodeURIComponent(slug);
        return path + location.search;
      }

      function syncUrlFromPad() {
        var next = currentUrl();
        if (location.pathname + location.search !== next) history.replaceState(null, "", next);
      }

      function syncPadFromPath() {
        pad.value = splitPath().slug;
      }

      function migrateHashToPathOnce() {
        var h = location.hash.replace(/^#/, "");
        if (!h.length) return;
        try {
          h = decodeURIComponent(h);
        } catch (e) {}
        if (splitPath().slug.length) return;
        pad.value = h;
        history.replaceState(null, "", currentUrl());
      }

      pad.addEventListener("change", function () {
        syncUrlFromPad();
        loadFromStorage();
        refreshDecode();
      });
      pad.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          pad.blur();
        }
      });

      input.addEventListener("input", function () {
        scheduleSave();
        refreshDecode();
      });

      window.addEventListener("popstate", function () {
        syncPadFromPath();
        loadFromStorage();
        refreshDecode();
      });

      brand.addEventListener("click", function (e) {
        e.preventDefault();
        pad.value = "";
        var sp = splitPath();
        var path = sp.basePath;
        if (path.length > 1 && !path.endsWith("/")) path += "/";
        history.replaceState(null, "", path + location.search);
        input.value = "";
        output.value = "";
        status.textContent = "";
        status.classList.remove("err");
        pad.focus();
      });

      migrateHashToPathOnce();
      syncPadFromPath();
      if (!pad.value) pad.placeholder = "yourpage";
      loadFromStorage();
      refreshDecode();
    })();
  </script>
</body>
</html>
